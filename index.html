<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #e8c98a;
      --gold-light: #f7d684;
      --bg: #0d0b08;
      --surface: #141210;
      --text: #fffbf0;
      --muted: #a89968;
      --border: rgba(232, 201, 138, 0.25);
    }

    [data-theme="tet"] {
      --gold: #ffd700;
      --gold-light: #ffe98a;
      --bg: #2a0a0a;
      --surface: #7a1f1f;
      --text: #fff6e0;
      --muted: #e8b98a;
      --border: rgba(255, 215, 0, 0.3);
    }

    [data-theme="neon"] {
      --gold: #00f0ff;
      --gold-light: #ff2fd0;
      --bg: #08040f;
      --surface: #140a26;
      --text: #eafcff;
      --muted: #7d6fa8;
      --border: rgba(0, 240, 255, 0.25);
    }

    html:not([data-theme]) body,
    html[data-theme="dark-gold"] body {
      background: radial-gradient(circle at 50% -10%, #241c0e 0%, var(--bg) 55%);
    }

    body {
      background: var(--bg);
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 14px;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(232, 201, 138, 0.1), transparent 45%),
        radial-gradient(circle at 82% 80%, rgba(232, 201, 138, 0.07), transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(232, 201, 138, 0.05), transparent 60%);
      animation: goldPulse 8s ease-in-out infinite;
      transition: background 0.4s ease;
    }

    @keyframes goldPulse {

      0%,
      100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.2);
      }
    }

    [data-theme="dark-gold"] .pip,
    body:not([data-theme]) .pip {
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(232, 201, 138, 0.1), 0 0 24px rgba(232, 201, 138, 0.05);
    }

    [data-theme="dark-gold"] .pip:hover,
    body:not([data-theme]) .pip:hover {
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(232, 201, 138, 0.15), 0 0 34px rgba(232, 201, 138, 0.12);
    }

    [data-theme="tet"] body::before {
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 215, 0, 0.18), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 90, 60, 0.16), transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(255, 215, 0, 0.08), transparent 60%);
      animation: tetGlow 5s ease-in-out infinite;
    }

    @keyframes tetGlow {

      0%,
      100% {
        filter: brightness(1) saturate(1);
      }

      50% {
        filter: brightness(1.25) saturate(1.15);
      }
    }

    [data-theme="tet"] .pip {
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 215, 0, 0.15), 0 0 30px rgba(255, 215, 0, 0.1);
    }

    [data-theme="tet"] .pip:hover {
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 215, 0, 0.22), 0 0 45px rgba(255, 165, 60, 0.2);
    }

    [data-theme="tet"] .unit-value {
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    [data-theme="tet"] .unit-value.tick {
      text-shadow: 0 0 16px rgba(255, 165, 60, 0.8);
    }

    [data-theme="tet"] .event-label span {
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    [data-theme="neon"] body::before {
      background:
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.16), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 47, 208, 0.14), transparent 45%);
      animation: neonPulse 6s ease-in-out infinite;
    }

    @keyframes neonPulse {

      0%,
      100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.35);
      }
    }

    [data-theme="neon"] .pip {
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), 0 0 60px rgba(255, 47, 208, 0.08), inset 0 1px 0 rgba(0, 240, 255, 0.1);
    }

    [data-theme="neon"] .pip:hover {
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.28), 0 0 80px rgba(255, 47, 208, 0.16), inset 0 1px 0 rgba(0, 240, 255, 0.15);
    }

    [data-theme="neon"] .unit-value {
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    [data-theme="neon"] .unit-value.tick {
      text-shadow: 0 0 16px rgba(255, 47, 208, 0.8);
    }

    [data-theme="neon"] .event-label span {
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    body>* {
      position: relative;
      z-index: 1;
    }

    /* ── Selector tabs ── */
    .selector {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
    }

    .tab {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 18px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
      border: 1px solid transparent;
      user-select: none;
      font-weight: 600;
    }

    .tab:hover {
      color: var(--gold-light);
    }

    .pip-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      padding: 8px 18px;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .pip-btn:hover {
      color: var(--gold-light);
      border-color: rgba(200, 169, 110, 0.4);
      background: rgba(200, 169, 110, 0.08);
    }

    .pip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 44px;
      display: flex;
      align-items: center;
      gap: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(200, 169, 110, 0.08);
      min-width: 540px;
      transition: box-shadow 0.3s ease, transform 0.3s ease, background 0.4s ease, border-color 0.4s ease;
    }

    .pip:hover {
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(200, 169, 110, 0.12), 0 0 0 1px var(--border);
      transform: translateY(-2px);
    }

    .pip::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.6;
    }

    html:not([data-theme]) .pip {
      position: relative;
      isolation: isolate;
    }

    html:not([data-theme]) .pip::after {
      content: '';
      position: absolute;
      inset: -2px;
      z-index: -1;
      border-radius: 18px;
      padding: 1px;
      background: conic-gradient(from 0deg, transparent 0%, var(--gold) 12%, transparent 24%, transparent 76%, var(--gold-light) 88%, transparent 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ringSpin 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes ringSpin {
      to {
        transform: rotate(360deg);
      }
    }

    html:not([data-theme]) .unit-value {
      background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, #a8842f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 8px rgba(232, 201, 138, 0.35));
    }

    html:not([data-theme]) .unit-value.tick {
      filter: drop-shadow(0 0 14px rgba(247, 214, 132, 0.75));
    }

    .event-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      line-height: 1.5;
      min-width: 120px;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      font-weight: 600;
    }

    .event-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .event-label span {
      display: block;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.18em;
      margin-bottom: 6px;
      font-family: 'Space Mono', monospace;
    }

    .vline {
      width: 1px;
      height: 60px;
      background: var(--border);
      flex-shrink: 0;
    }

    .countdown {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.3s ease 0.06s, transform 0.3s ease 0.06s;
    }

    .countdown.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .unit-value {
      font-size: 40px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      letter-spacing: -0.02em;
      min-width: 60px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: color 0.25s;
    }

    .unit-value.tick {
      color: var(--gold);
    }

    .unit-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .sep {
      font-size: 28px;
      color: var(--muted);
      padding: 0 2px;
      margin-bottom: 18px;
      opacity: 0.35;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 0.1;
      }
    }

    /* ── Theme Selector ── */
    .theme-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .theme-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      font-weight: 1200;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .theme-btn:hover {
      color: var(--gold-light);
    }


    .theme-btn.active {
      color: #a85c00;
      border-color: var(--gold);
      background: rgba(232, 201, 138, 0.18);
      font-weight: 800;
    }

    [data-theme="tet"] .theme-btn.active {
      color: #ffd700;
      background: rgba(255, 215, 0, 0.14);
      border-color: #ffd700;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
    }

    [data-theme="neon"] .theme-btn.active {
      color: #00f0ff;
      background: rgba(0, 240, 255, 0.12);
      border-color: #00f0ff;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.7);
    }

    @media (max-width: 640px) {
      .pip {
        min-width: 0;
        width: 100%;
        flex-direction: column;
        gap: 16px;
        padding: 22px 18px;
      }

      .vline {
        width: 60%;
        height: 1px;
      }

      .event-label {
        min-width: 0;
        text-align: center;
      }

      .unit-value {
        font-size: 30px;
        min-width: 44px;
      }

      .selector {
        flex-wrap: wrap;
        justify-content: center;
      }

      .tab,
      .pip-btn {
        padding: 8px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="theme-selector">
    <button class="theme-btn active" data-theme="dark-gold">🌙 Dark Theme</button>
    <button class="theme-btn" data-theme="tet">🎆 Lunar New Year</button>
    <button class="theme-btn" data-theme="neon">⚡ Neon Cyber</button>
  </div>

  <div class="selector">
    <div class="tab active" data-idx="0">Quốc Khánh 2/9</div>
    <div class="tab" data-idx="1">Tết Nguyên Đán</div>
    <div class="tab" data-idx="2">Time Back Home</div>
    <button class="pip-btn" id="pip-btn">📺 PiP</button>
  </div>

  <div class="pip">
    <div class="event-label visible" id="label">
      <span id="label-badge">2/9</span>
      Quốc Khánh<br>Việt Nam
    </div>
    <div class="vline"></div>
    <div class="countdown visible" id="countdown">
      <div class="unit">
        <div class="unit-value" id="cd">00</div>
        <div class="unit-label">ngày</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="unit-value" id="ch">00</div>
        <div class="unit-label">giờ</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="unit-value" id="cm">00</div>
        <div class="unit-label">phút</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="unit-value" id="cs">00</div>
        <div class="unit-label">giây</div>
      </div>
    </div>
  </div>

  <script>
    function getNextWorkEndTime() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 17, 45, 0);
      if (now < start || now >= end) {
        return null; // Không đếm ngược ngoài khoảng
      }
      return end;
    }

    // Ngày cố định hàng năm (vd 2/9) -> tự động nhảy sang năm sau khi đã qua
    function getNextAnnualDate(month, day) {
      const now = new Date();
      let target = new Date(now.getFullYear(), month, day, 0, 0, 0);
      if (target <= now) {
        target = new Date(now.getFullYear() + 1, month, day, 0, 0, 0);
      }
      return target;
    }

    // Bảng ngày Tết Nguyên Đán (âm lịch không tính theo công thức cố định)
    const lunarNewYearDates = {
      2024: '2024-02-10', 2025: '2025-01-29', 2026: '2026-02-17',
      2027: '2027-02-06', 2028: '2028-01-26', 2029: '2029-02-13',
      2030: '2030-02-03', 2031: '2031-01-23', 2032: '2032-02-11',
      2033: '2033-01-31', 2034: '2034-02-19', 2035: '2035-02-08'
    };
    const lunarNewYearNames = {
      2024: 'Năm Giáp Thìn', 2025: 'Năm Ất Tỵ', 2026: 'Năm Bính Ngọ',
      2027: 'Năm Đinh Mùi', 2028: 'Năm Mậu Thân', 2029: 'Năm Kỷ Dậu',
      2030: 'Năm Canh Tuất', 2031: 'Năm Tân Hợi', 2032: 'Năm Nhâm Tý',
      2033: 'Năm Quý Sửu', 2034: 'Năm Giáp Dần', 2035: 'Năm Ất Mão'
    };
    function getNextTet() {
      const now = new Date();
      const years = Object.keys(lunarNewYearDates).map(Number).sort((a, b) => a - b);
      for (const y of years) {
        const d = new Date(lunarNewYearDates[y] + 'T00:00:00');
        if (d > now) return d;
      }
      // Hết bảng dữ liệu, trả về ngày cuối cùng đã biết
      const lastYear = years[years.length - 1];
      return new Date(lunarNewYearDates[lastYear] + 'T00:00:00');
    }

    const events = [
      {
        isDynamic: true, getTarget: () => getNextAnnualDate(8, 2),
        badgeFn: (t) => `2/9 • ${t.getFullYear()}`, name: 'Quốc Khánh<br>Việt Nam'
      },
      {
        isDynamic: true, getTarget: getNextTet,
        badgeFn: (t) => `${lunarNewYearNames[t.getFullYear()] || 'TẾT'} • ${t.getFullYear()}`, name: 'Tết Nguyên Đán<br>Lunar New Year'
      },
      { isDynamic: true, getTarget: getNextWorkEndTime, badge: 'HÔM NAY • 17:45', name: 'Time <br> Back Home' }
    ];

    let current = 0;
    const labelEl = document.getElementById('label');
    const cdEl = document.getElementById('countdown');
    const tabs = document.querySelectorAll('.tab');

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateUnit(id, val) {
      const el = document.getElementById(id);
      const str = pad(val);
      if (el.textContent !== str) {
        el.textContent = str;
        el.classList.remove('tick');
        void el.offsetWidth;
        el.classList.add('tick');
        setTimeout(() => el.classList.remove('tick'), 280);
      }
    }

    function calc(target) {
      const diff = target - Date.now();
      if (diff <= 0) return { d: 0, h: 0, m: 0, s: 0 };
      const s = Math.floor(diff / 1000);
      return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
    }

    // Thông báo nổi khi Time Back Home về 0 và trước 30 giây
    let notifiedBackHome = false;
    let notified30s = false;
    function showBackHomeNotification() {
      if (window.Notification && Notification.permission === 'granted') {
        new Notification('Tắt máy đi về', { body: 'Đã hết giờ làm, tắt máy về thôi!' });
      } else if (window.Notification && Notification.permission !== 'denied') {
        Notification.requestPermission().then(function (permission) {
          if (permission === 'granted') {
            new Notification('Tắt máy đi về', { body: 'Đã hết giờ làm, tắt máy về thôi!' });
          } else {
            alert('Đã hết giờ làm,tắt máy về thôi!');
          }
        });
      } else {
        alert('Đã hết giờ làm, tắt máy về thôi!');
      }
    }

    function showFocusNotification() {
      if (window.Notification && Notification.permission === 'granted') {
        const n = new Notification('Sắp hết giờ làm!', {
          body: 'Chuẩn bị tắt máy về thôi!',
        });
        n.onclick = function () {
          window.focus();
        };
      } else if (window.Notification && Notification.permission !== 'denied') {
        Notification.requestPermission().then(function (permission) {
          if (permission === 'granted') {
            const n = new Notification('Sắp hết giờ làm!', {
              body: 'Chuẩn bị tắt máy về thôi!',
            });
            n.onclick = function () {
              window.focus();
            };
          }
        });
      }
    }

    function badgeFor(ev, target) {
      return ev.badgeFn ? ev.badgeFn(target) : ev.badge;
    }

    function tick() {
      const ev = events[current];
      let target = ev.isDynamic ? ev.getTarget() : ev.target;
      let c;
      if (ev.isDynamic && !target) {
        c = { d: 0, h: 0, m: 0, s: 0 };
      } else {
        c = calc(target);
        if (ev.badgeFn) {
          const badgeSpan = labelEl.querySelector('span');
          const newBadge = badgeFor(ev, target);
          if (badgeSpan && badgeSpan.textContent !== newBadge) badgeSpan.textContent = newBadge;
        }
      }
      updateUnit('cd', c.d); updateUnit('ch', c.h);
      updateUnit('cm', c.m); updateUnit('cs', c.s);
      // Nếu là tab Time Back Home và countdown về 0 thì hiện thông báo nổi
      if (current === 2 && c.d === 0 && c.h === 0 && c.m === 0 && c.s === 0 && !notifiedBackHome) {
        notifiedBackHome = true;
        showBackHomeNotification();
      }
      // Trước 30 giây thì gửi notification focus nếu chưa gửi
      if (current === 2 && c.d === 0 && c.h === 0 && c.m === 0 && c.s === 30 && !notified30s) {
        notified30s = true;
        showFocusNotification();
      }
      // Reset khi chuyển sang event khác hoặc thời gian khác 0/30s
      if (current !== 2 || c.d !== 0 || c.h !== 0 || c.m !== 0 || (c.s !== 0 && c.s !== 30)) {
        if (c.s !== 0) notifiedBackHome = false;
        if (c.s !== 30) notified30s = false;
      }
    }

    function switchEvent(idx) {
      if (idx === current) return;
      current = idx;

      labelEl.classList.remove('visible');
      cdEl.classList.remove('visible');

      setTimeout(() => {
        const ev = events[current];
        const target = ev.isDynamic ? ev.getTarget() : ev.target;
        labelEl.innerHTML = `<span>${badgeFor(ev, target)}</span>${ev.name}`;
        tick();
        requestAnimationFrame(() => {
          labelEl.classList.add('visible');
          cdEl.classList.add('visible');
        });
      }, 250);

      tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
    }

    tabs.forEach(tab => tab.addEventListener('click', () => switchEvent(+tab.dataset.idx)));

    // Theme switching
    const themeBtns = document.querySelectorAll('.theme-btn');
    const html = document.documentElement;

    function setTheme(themeName) {
      if (themeName === 'dark-gold') {
        html.removeAttribute('data-theme');
      } else {
        html.setAttribute('data-theme', themeName);
      }
      localStorage.setItem('selectedTheme', themeName);
      themeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.theme === themeName));
    }

    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('selectedTheme') || 'dark-gold';
    setTheme(savedTheme);

    // Theme color palettes
    const themeColors = {
      'dark-gold': {
        bg: '#0d0b08',
        surface: '#141210',
        text: '#fffbf0',
        gold: '#e8c98a',
        goldLight: '#f5dea3',
        muted: '#a89968',
        borderColor: 'rgba(232,201,138,0.25)',
        boxShadowInset: 'rgba(232,201,138,0.12)',
        shadowMain: 'rgba(0,0,0,0.6)'
      },
      'tet': {
        bg: '#2a0a0a',
        surface: '#7a1f1f',
        text: '#fff6e0',
        gold: '#ffd700',
        goldLight: '#ffe98a',
        muted: '#e8b98a',
        borderColor: 'rgba(255,215,0,0.3)',
        boxShadowInset: 'rgba(255,215,0,0.15)',
        shadowMain: 'rgba(0,0,0,0.5)'
      },
      'neon': {
        bg: '#08040f',
        surface: '#140a26',
        text: '#eafcff',
        gold: '#00f0ff',
        goldLight: '#ff2fd0',
        muted: '#7d6fa8',
        borderColor: 'rgba(0,240,255,0.25)',
        boxShadowInset: 'rgba(0,240,255,0.12)',
        shadowMain: 'rgba(0,0,0,0.6)'
      }
    };

    function getCurrentThemeColors() {
      const theme = html.getAttribute('data-theme') || 'dark-gold';
      return themeColors[theme];
    }

    // PiP functionality
    async function openPiP() {
      if (!("documentPictureInPicture" in window)) {
        alert("PiP không được hỗ trợ trên trình duyệt này");
        return;
      }

      const colors = getCurrentThemeColors();
      const pipWindow = await documentPictureInPicture.requestWindow({ width: 500, height: 160 });
      const doc = pipWindow.document;
      doc.title = '';
      doc.documentElement.lang = 'vi';

      // Add styles
      const link = doc.createElement('link');
      link.href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap';
      link.rel = 'stylesheet';
      doc.head.appendChild(link);

      doc.body.style.cssText = `
      margin: 0;
      padding: 0;
      background: ${colors.bg};
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    `;

      // Create pip card
      const pipCard = doc.createElement('div');
      pipCard.style.cssText = `
      background: ${colors.surface};
      border: 1px solid ${colors.borderColor};
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px ${colors.shadowMain}, inset 0 1px 0 ${colors.boxShadowInset};
      width: 90%;
    `;

      // Top border
      const border = doc.createElement('div');
      border.style.cssText = `
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, ${colors.gold}, transparent);
      opacity: 0.6;
    `;
      pipCard.appendChild(border);

      // Event label
      const label = doc.createElement('div');
      const ev = events[current];
      const evTarget = ev.isDynamic ? ev.getTarget() : ev.target;
      const evBadge = badgeFor(ev, evTarget);
      label.style.cssText = `
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: ${colors.muted};
      white-space: nowrap;
      line-height: 1.4;
      min-width: 70px;
      font-weight: 600;
    `;
      label.innerHTML = `<span style="display:block;color:${colors.gold};font-size:8px;letter-spacing:0.18em;margin-bottom:2px;font-weight:700;">${evBadge}</span>${ev.name}`;
      pipCard.appendChild(label);

      // Vertical line
      const vline = doc.createElement('div');
      vline.style.cssText = `width:1px;height:32px;background:${colors.borderColor};`;
      pipCard.appendChild(vline);

      // Countdown
      const countdown = doc.createElement('div');
      countdown.style.cssText = `
      display: flex;
      align-items: center;
      gap: 1px;
      font-family: 'Space Mono', monospace;
    `;

      const createUnit = (lbl) => {
        const unit = doc.createElement('div');
        unit.style.cssText = `
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      `;
        const val = doc.createElement('div');
        val.style.cssText = `
        font-size: 18px;
        font-weight: 800;
        color: ${colors.text};
        line-height: 1;
        font-variant-numeric: tabular-nums;
        min-width: 30px;
        text-align: center;
      `;
        val.textContent = '00';
        const valLbl = doc.createElement('div');
        valLbl.style.cssText = `
        font-size: 6px;
        letter-spacing: 0.15em;
        color: ${colors.muted};
        text-transform: uppercase;
        font-weight: 700;
      `;
        valLbl.textContent = lbl;
        unit.appendChild(val);
        unit.appendChild(valLbl);
        return { unit, val };
      };

      const d = createUnit('ngày');
      const h = createUnit('giờ');
      const m = createUnit('phút');
      const s = createUnit('giây');

      const sep = () => {
        const el = doc.createElement('div');
        el.style.cssText = `
        font-size: 14px;
        color: ${colors.muted};
        padding: 0 2px;
        margin-bottom: 8px;
        opacity: 0.5;
        animation: blink 1s step-end infinite;
        font-weight: 700;
        font-weight: 700;
      `;
        el.textContent = ':';
        return el;
      };

      countdown.appendChild(d.unit);
      countdown.appendChild(sep());
      countdown.appendChild(h.unit);
      countdown.appendChild(sep());
      countdown.appendChild(m.unit);
      countdown.appendChild(sep());
      countdown.appendChild(s.unit);
      pipCard.appendChild(countdown);

      // Add animation
      const style = doc.createElement('style');
      style.textContent = `
      @keyframes blink {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.1; }
      }
    `;
      doc.head.appendChild(style);
      doc.body.appendChild(pipCard);

      // Update function
      function refresh() {
        const ev = events[current];
        const target = ev.isDynamic ? ev.getTarget() : ev.target;
        const c = calc(target);
        d.val.textContent = pad(c.d);
        h.val.textContent = pad(c.h);
        m.val.textContent = pad(c.m);
        s.val.textContent = pad(c.s);
      }
      refresh();
      setInterval(refresh, 1000);
    }

    document.getElementById('pip-btn').addEventListener('click', openPiP);

    // Khởi tạo label ban đầu theo target động
    (function initLabel() {
      const ev = events[current];
      const target = ev.isDynamic ? ev.getTarget() : ev.target;
      labelEl.innerHTML = `<span>${badgeFor(ev, target)}</span>${ev.name}`;
    })();

    tick();
    setInterval(tick, 1000);
  </script>
</body>

</html>
